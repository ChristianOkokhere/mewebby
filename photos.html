        <style>
            main img { cursor: zoom-in; }
            #lightbox {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.92);
                z-index: 1000;
                cursor: zoom-out;
                align-items: center;
                justify-content: center;
            }
            #lightbox.open { display: flex; }
            #lightbox img {
                max-width: 94vw;
                max-height: 88vh;
                width: auto;
                height: auto;
                margin: 0;
            }
            #lightbox { flex-direction: column; }
            #lightbox p {
                color: #aaa;
                font-size: 14px;
                margin: 10px 0 0;
            }
            #grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
                align-items: center;
            }
            /* verticals sit together at the bottom, starting on a fresh row */
            #grid > .first-vertical, #grid > .slot:has(.first-vertical) { grid-column-start: 1; }
            #grid img {
                display: block;
                width: 100%;
                height: auto;
                margin: 0;
                background: #e6e6e6;
            }
            /* order mode: open photos.html?order, click photos in the order you want them */
            .slot { position: relative; }
            .slot img { cursor: pointer; }
            .slot.picked img { opacity: 0.45; }
            .slot b {
                display: none;
                position: absolute;
                top: 8px;
                left: 8px;
                min-width: 30px;
                height: 30px;
                padding: 0 8px;
                border-radius: 15px;
                background: #222;
                color: #fff;
                font-size: 15px;
                line-height: 30px;
                text-align: center;
            }
            .slot.picked b { display: block; }
            /* cut mode: open photos.html?cut, click photos to mark them for removal */
            .slot.cut img { opacity: 0.15; outline: 3px solid #d00; outline-offset: -3px; }
            #orderbar {
                display: none;
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #222;
                color: #fff;
                padding: 10px 18px;
                border-radius: 999px;
                font-size: 15px;
                z-index: 900;
                gap: 12px;
                align-items: center;
                white-space: nowrap;
            }
            body.order #orderbar, body.cut #orderbar { display: flex; }
            #orderbar button {
                font: inherit;
                background: #fff;
                color: #222;
                border: 0;
                border-radius: 999px;
                padding: 3px 14px;
                cursor: pointer;
            }
        </style>

   <div id="lightbox"><img alt="expanded photo"><p></p></div>
   <div id="orderbar"><span id="ordercount"></span><button id="orderundo">Undo</button><button id="orderclear">Clear</button><button id="ordercopy">Copy list</button></div>
   <script>
     (function () {
         var lb = document.getElementById('lightbox');
         var lbImg = lb.querySelector('img');
         var lbCap = lb.querySelector('p');
         var thumbs = Array.prototype.slice.call(document.querySelectorAll('#grid img'));
         var current = -1;
         // show the fast version right away, then swap in the full-res original once it loads
         function show(fast, full, caption) {
             lbImg.src = fast;
             lbImg.dataset.full = full;
             lbCap.textContent = caption || '';
             lb.classList.add('open');
             var hi = new Image();
             hi.onload = function () {
                 if (lb.classList.contains('open') && lbImg.dataset.full === full) lbImg.src = full;
             };
             hi.src = full;
         }
         function showThumb(i) {
             current = (i + thumbs.length) % thumbs.length;
             var t = thumbs[current];
             show(t.dataset.webp, t.dataset.full, t.dataset.caption);
         }
         var mode = /[?&]order\b/.test(location.search) ? 'order' : /[?&]cut\b/.test(location.search) ? 'cut' : '';
         var ordering = mode !== '';
         var KEY = 'photos-' + mode;
         var seq = [];
         function drawOrder() {
             thumbs.forEach(function (t) {
                 var n = seq.indexOf(t.dataset.id);
                 t.parentNode.classList.toggle(mode === 'order' ? 'picked' : 'cut', n >= 0);
                 t.parentNode.querySelector('b').textContent = n + 1;
             });
             document.getElementById('ordercount').textContent = mode === 'order'
                 ? seq.length + ' of ' + thumbs.length + ' ordered'
                 : seq.length + ' marked to cut';
             try { localStorage.setItem(KEY, JSON.stringify(seq)); } catch (e) {}
         }
         if (ordering) {
             document.body.classList.add(mode);
             thumbs.forEach(function (t) {
                 var slot = document.createElement('div');
                 slot.className = 'slot';
                 t.parentNode.insertBefore(slot, t);
                 slot.appendChild(t);
                 slot.appendChild(document.createElement('b'));
             });
             var ids = thumbs.map(function (t) { return t.dataset.id; });
             try {
                 JSON.parse(localStorage.getItem(KEY) || '[]').forEach(function (id) { if (ids.indexOf(id) >= 0) seq.push(id); });
             } catch (e) {}
             drawOrder();
             document.getElementById('orderundo').addEventListener('click', function () { seq.pop(); drawOrder(); });
             document.getElementById('orderclear').addEventListener('click', function () { seq = []; drawOrder(); });
             document.getElementById('ordercopy').addEventListener('click', function () {
                 var btn = this;
                 navigator.clipboard.writeText(seq.join('\n')).then(function () {
                     btn.textContent = 'Copied';
                     setTimeout(function () { btn.textContent = 'Copy list'; }, 1500);
                 });
             });
         }
         thumbs.forEach(function (t, i) {
             t.addEventListener('click', function () {
                 if (!ordering) return showThumb(i);
                 var n = seq.indexOf(t.dataset.id);
                 if (n >= 0) seq.splice(n, 1); else seq.push(t.dataset.id);
                 drawOrder();
             });
         });
         var hero = document.getElementById('hero-img');
         hero.addEventListener('click', function () {
             current = -1;
             show(hero.currentSrc || hero.src, hero.getAttribute('src'), document.getElementById('hero-stats').textContent);
         });
         lb.addEventListener('click', function () {
             lb.classList.remove('open');
         });
         document.addEventListener('keydown', function (e) {
             if (!lb.classList.contains('open')) return;
             if (e.key === 'Escape') lb.classList.remove('open');
             if (current < 0) return;
             if (e.key === 'ArrowRight') showThumb(current + 1);
             if (e.key === 'ArrowLeft') showThumb(current - 1);
         });
     })();
   </script>
